<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Orange-500 into orange-800. The warm end of the wheel is shared with
         two CRM addons, so this one is pitched brighter and more saturated than
         either: LeadHub runs gold into orange, Lead Magnets amber into brown.
         Inside the commerce layer, where these icons actually sit beside each
         other, orange is unused. -->
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F97316"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.32"/>
    </filter>

    <!-- The outline is declared once so the three edges below can be clipped to
         it and the glyph stays one piece of white. -->
    <path id="cube" d="M277.1 88.4 L399.9 154.6 Q421 166 421 190 L421 322 Q421 346 399.9 357.4 L277.1 423.6 Q256 435 234.9 423.6 L112.1 357.4 Q91 346 91 322 L91 190 Q91 166 112.1 154.6 L234.9 88.4 Q256 77 277.1 88.4 Z"/>
    <clipPath id="in"><use href="#cube"/></clipPath>
  </defs>

  <!-- rounded square background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- a solid: the thing itself, before anybody prices it, dresses it up or is
       let into it. Payments has the card, Offers the tag, Entitlements the key,
       and all three are about something. This is that something, so it is a
       plain object and nothing more. Deliberately not a carton — this addon
       delivers nothing, and a lid or a strip of tape would promise shipping.
       The three edges are punched out with the background rather than shaded,
       the same way Payments cuts its stripe and Offers its hole: the glyph has
       to stay one piece of flat white to sit with the rest of the suite. -->
  <g filter="url(#sh)">
    <use href="#cube" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#in)" stroke="url(#bg)" stroke-width="28" stroke-linecap="round">
    <path d="M256 255 L81 161"/>
    <path d="M256 255 L431 161"/>
    <path d="M256 255 L256 445"/>
  </g>
</svg>
