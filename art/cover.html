<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    background: radial-gradient(1200px 700px at 78% 22%, #172554 0%, #0F1B3D 55%, #050914 100%);
    color: #fff; overflow: hidden; position: relative;
  }
  .wrap { display: flex; height: 100%; align-items: center; padding: 0 92px; gap: 64px; }
  .copy { max-width: 660px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 22px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
    color: #FED7AA; margin-bottom: 26px;
  }
  .eyebrow .dot { width: 12px; height: 12px; border-radius: 50%; background: #F97316; box-shadow: 0 0 18px #F97316; }
  h1 { font-size: 78px; line-height: 1.02; font-weight: 800; letter-spacing: -.02em; }
  h1 .accent { background: linear-gradient(90deg,#FED7AA,#FB923C); -webkit-background-clip: text; background-clip: text; color: transparent; }
  p.sub { margin-top: 28px; font-size: 30px; line-height: 1.35; color: #CBD5E1; font-weight: 400; }
  .badges { margin-top: 40px; display: flex; gap: 14px; }
  .badge { font-size: 22px; font-weight: 600; padding: 12px 22px; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.16); color: #FED7AA; white-space: nowrap; }
  .art { flex: 1; display: flex; align-items: center; justify-content: center; }
  .glyph { width: 360px; height: 360px; filter: drop-shadow(0 30px 60px rgba(0,0,0,.45)); }
  .corner { position: absolute; right: -120px; bottom: -160px; width: 520px; height: 520px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #F9731647, transparent 60%); }
</style>
</head>
<body>
  <div class="corner"></div>
  <div class="wrap">
    <div class="copy">
      <span class="eyebrow"><span class="dot"></span>Statamic Addon</span>
      <h1>Statamic<br><span class="accent">Products</span></h1>
      <p class="sub">The thing that is sold, with a name, a list price, and the access it grants.</p>
      <div class="badges">
        <span class="badge">Defined once</span>
        <span class="badge">List price</span>
        <span class="badge">Opens access</span>
      </div>
    </div>
    <div class="art">
      <svg class="glyph" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
            <stop stop-color="#F97316"/><stop offset="1" stop-color="#9A3412"/>
          </linearGradient>
          <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C2D12" flood-opacity="0.32"/>
          </filter>
          <path id="cube" d="M277.1 88.4 L399.9 154.6 Q421 166 421 190 L421 322 Q421 346 399.9 357.4 L277.1 423.6 Q256 435 234.9 423.6 L112.1 357.4 Q91 346 91 322 L91 190 Q91 166 112.1 154.6 L234.9 88.4 Q256 77 277.1 88.4 Z"/>
          <clipPath id="in"><use href="#cube"/></clipPath>
        </defs>
        <rect width="512" height="512" rx="112" fill="url(#bg)"/>
        <!-- a solid: the thing itself, before anybody prices it, dresses it up or is
       let into it. Payments has the card, Offers the tag, Entitlements the key,
       and all three are about something. This is that something. -->
  <g filter="url(#sh)">
    <use href="#cube" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#in)" stroke="url(#bg)" stroke-width="28" stroke-linecap="round">
    <path d="M256 255 L81 161"/>
    <path d="M256 255 L431 161"/>
    <path d="M256 255 L256 445"/>
  </g>
      </svg>
    </div>
  </div>
</body>
</html>
